<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
            content="width=device-width,initial-scale=1"><meta
            name="color-scheme" content="light"><link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"><link
            rel="stylesheet" href="style.css"><title>Labour Market
            Place</title></head><body><header class="bar"><nav class="container"
                id="nav"></nav></header><main class="container"><article
                class="box"><h2>Register</h2><p>Create your account in one
                    minute.</p><form id="reg"><label>Full Name<input name="name"
                            required></label><label>Phone Number<input
                            name="phone" type="tel" pattern="01[0-9]{9}"
                            title="11 digit number, 01XXXXXXXXX"
                            placeholder="01XXXXXXXXX"
                            required></label><label>Email (optional)<input
                            name="email" type="email"></label><div
                        class="grid"><label>District<select name="district"
                                required><option
                                    value>Select</option></select></label><label>Role<select
                                name="role" required><option
                                    value>Select</option><option
                                    value="worker">Worker</option><option
                                    value="client">Client</option></select></label></div><label>Password<input
                            name="password" type="password" minlength="6"
                            placeholder="At least 6 characters"
                            required></label><label>Confirm Password<input
                            name="confirm" type="password"
                            required></label><label><input type="checkbox"
                            required> I agree to the terms and
                        conditions</label><button>Register</button><small
                        id="msg"></small></form><p>Have an account? <a
                        href="login.html">Login</a></p></article></main><footer
            class="container"><small>&copy; 2026 Labour Market Place. All rights
                reserved.</small></footer><script
            src="app.js"></script></body></html>
