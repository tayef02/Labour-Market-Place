<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
            content="width=device-width,initial-scale=1"><meta
            name="color-scheme" content="light"><link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"><link
            rel="stylesheet" href="style.css"><title>Labour Market
            Place</title></head><body><header class="bar"><nav class="container"
                id="nav"></nav></header><main class="container"><article
                class="box"><h2>My Worker Profile</h2><p>Clients see this on the
                    Find Workers page.</p><form id="prof"><label>Work /
                        Skill<input name="skill" list="sk"
                            placeholder="e.g. Mason" required><datalist
                            id="sk"><option>Mason</option><option>Electrician</option><option>Plumber</option><option>Painter</option><option>Carpenter</option><option>Day
                                Labour</option></datalist></label><div
                        class="grid"><label>Daily wage (৳)<input
                                name="daily_wage" type="number" min="0"
                                required></label><label>Hours per day<input
                                name="hours_per_day" type="number" min="1"
                                max="24" required></label></div><label>NID
                        number (kept private)<input name="nid"
                            inputmode="numeric"
                            placeholder="Leave blank to keep old"></label><label>Availability<select
                            name="available"><option
                                value="true">Available</option><option
                                value="false">Unavailable</option></select></label><label>Password
                        (to confirm)<input name="password" type="password"
                            required></label><button>Save Profile</button><small
                        id="msg"></small></form></article></main><footer
            class="container"><small>&copy; 2026 Labour Market Place. All rights
                reserved.</small></footer><script
            src="app.js"></script></body></html>
