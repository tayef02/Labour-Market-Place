<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Wage Rates | Labour Market Place</title>
</head>

<body>

    <header class="topbar" id="nav"></header>

    <main>
        <section class="page-top">
            <h1>Wage rates</h1>
            <p>What employers are really paying, worked out from the jobs posted on this site.</p>
        </section>

        <div class="wrap">

            <div class="panel">
                <div class="field">
                    <label for="district">District</label>
                    <select id="district"></select>
                </div>

                <button type="button" class="btn btn-main" onclick="loadRates()">Show rates</button>
            </div>

            <p class="dim" id="count"></p>

            <div class="panel">
                <div class="range-key">
                    <span><i class="k-band"></i>Lowest to highest paid</span>
                    <span><i class="k-avg"></i>Average</span>
                </div>

                <div id="rateTable">
                    <p class="loading">Loading...</p>
                </div>

                <p class="note">A daily wage, in taka. Treat it as a guide, not a fixed price.</p>
            </div>

        </div>
    </main>

    <footer id="foot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lang.js"></script>
    <script src="icons.js"></script>
    <script src="db.js"></script>

    <script>    layout("wage-rates.html");

    fillList("district", districtList, "All districts");

    loadRates();

    async function loadRates() {

        var query = db.from("jobs").select("job_type, wage");

        if (val("district") != "") {
            query = query.eq("district", val("district"));
        }

        var result = await query;
        var rows = result.data;

        if (rows == null || rows.length == 0) {
            document.getElementById("rateTable").innerHTML =
                '<p class="empty">No job posted here yet.</p>';
            setText("count", "");
            return;
        }

        setText("count", t("Worked out from") + " " + rows.length + " " + t("job posts."));

        var list = groupByTrade(rows);

        topWage = 1;

        for (var i = 0; i < list.length; i++) {
            if (list[i].high > topWage) { topWage = list[i].high; }
        }

        draw("rateTable", list, rateRow, '<p class="empty">No job posted here yet.</p>');
    }

    var topWage = 1;

    function groupByTrade(rows) {

        var box = {};

        for (var i = 0; i < rows.length; i++) {

            var trade = rows[i].job_type;
            var wage = Number(rows[i].wage);

            if (box[trade] == null) {
                box[trade] = { trade: trade, count: 0, sum: 0, low: wage, high: wage };
            }

            box[trade].count = box[trade].count + 1;
            box[trade].sum = box[trade].sum + wage;

            if (wage < box[trade].low) { box[trade].low = wage; }
            if (wage > box[trade].high) { box[trade].high = wage; }
        }

        var list = [];

        for (var key in box) {
            box[key].average = Math.round(box[key].sum / box[key].count);
            list.push(box[key]);
        }

        list.sort(function (a, b) { return b.average - a.average; });

        return list;
    }

    function rateRow(r) {

        var left = (r.low / topWage) * 100;
        var width = ((r.high - r.low) / topWage) * 100;

        if (width < 2) { width = 2; }

        var tick = (r.average / topWage) * 100;

        return '<div class="range-row">'
            + icon(r.trade, 26, "#1B5CFF")
            + '<b>' + r.trade + '</b>'
            + '<div class="range-track" title="' + money(r.low) + ' - ' + money(r.high) + '">'
            +     '<i></i>'
            +     '<u style="left:' + left + '%; width:' + width + '%"></u>'
            +     '<s style="left:' + tick + '%"></s>'
            + '</div>'
            + '<span class="num range-end">' + money(r.average) + '</span>'
            + '<span class="range-count">' + r.count + ' ' + t("posts") + '</span>'
            + '</div>';
    }
</script>

</body>
</html>
