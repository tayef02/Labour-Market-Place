<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Employer | Labour Market Place</title>
</head>

<body>

    <header class="topbar" id="nav"></header>

    <main>

        <section class="profile-bar">
            <div class="profile-inner">

                <div class="face" id="face"></div>

                <div class="who">
                    <b id="userName"></b>
                    <span>Employer</span>
                </div>

                <div class="who-stats">
                    <div>
                        <b class="hot" id="countLive">0</b>
                        <span>Live now</span>
                    </div>
                    <div>
                        <b id="countWait">0</b>
                        <span>Waiting for admin</span>
                    </div>
                    <div>
                        <b id="countAll">0</b>
                        <span>Posted in total</span>
                    </div>
                </div>

                <a href="#post" class="btn btn-main">Post a job</a>

            </div>
        </section>

        <div class="wrap" style="max-width: 1240px;">

            <div id="message" class="msg"></div>

            <p class="note" style="margin-bottom:14px">A job moves from left to right: you post it,
               people apply, you hire, and when the work is done you rate them.</p>

            <div class="pipe">

                <div class="lane">
                    <div class="lane-top"><b>My job posts</b><span id="n1">0</span></div>
                    <div class="lane-body" id="jobLane"><p class="loading">Loading...</p></div>
                </div>

                <div class="lane">
                    <div class="lane-top"><b>Who applied</b><span id="n2">0</span></div>
                    <div class="lane-body" id="appLane"><p class="loading">Loading...</p></div>
                </div>

                <div class="lane">
                    <div class="lane-top"><b>Hired</b><span id="n3">0</span></div>
                    <div class="lane-body" id="hiredLane"><p class="loading">Loading...</p></div>
                </div>

                <div class="lane">
                    <div class="lane-top"><b>Rate the workers</b><span id="n4">0</span></div>
                    <div class="lane-body" id="rateLane"><p class="loading">Loading...</p></div>
                </div>

            </div>

            <h2 class="title" style="margin-top:40px" id="post">Post a job</h2>

            <div class="panel">
                <p class="note" id="postNote"></p>

                <form id="jobForm" style="margin-top: 18px;">

                    <div class="field">
                        <label for="title">What is the work</label>
                        <input type="text" id="title" placeholder="Two masons for a boundary wall" required>
                    </div>

                    <div class="two">
                        <div class="field">
                            <label for="skill">Trade needed</label>
                            <select id="skill" required></select>
                        </div>

                        <div class="field">
                            <label for="wage">Daily wage (Tk)</label>
                            <input type="number" id="wage" placeholder="950" required>
                        </div>
                    </div>

                    <div class="two">
                        <div class="field">
                            <label for="workers">How many hands</label>
                            <input type="number" id="workers" min="1" placeholder="2" required>
                        </div>

                        <div class="field">
                            <label for="duration">How long</label>
                            <input type="text" id="duration" placeholder="6 days" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="startDate">Start date</label>
                        <input type="date" id="startDate" required>
                    </div>

                    <div class="field">
                        <label for="division">Division</label>
                        <select id="division" required>
                            <option value="">Choose division</option>
                        </select>
                    </div>

                    <div class="two">
                        <div class="field">
                            <label for="district">District</label>
                            <select id="district" required>
                                <option value="">Choose district</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="upazila">Upazila</label>
                            <select id="upazila" required>
                                <option value="">Choose upazila</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <label for="union">Union or Ward</label>
                        <input type="text" id="union" placeholder="Name of the union or ward" required>
                    </div>

                    <div class="field">
                        <label for="exactLocation">Exact location</label>
                        <input type="text" id="exactLocation" placeholder="Village, road, house number or a landmark" required>
                    </div>

                    <div class="field">
                        <label for="details">Anything else they should know</label>
                        <textarea id="details" rows="3" placeholder="Tools provided, food given, start time"></textarea>
                    </div>

                    <div class="field">
                        <label for="contact">Phone number for this job</label>
                        <input type="tel" id="contact" required>
                    </div>

                    <button type="submit" class="btn btn-main">Post the job</button>

                </form>
            </div>

        </div>
    </main>

    <footer id="foot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lang.js"></script>
    <script src="icons.js"></script>
    <script src="db.js"></script>
    <script src="voice.js"></script>
    <script src="locations.js"></script>

    <script>    var me = null;

    layout("");

    addFieldMics();

    start();

    async function start() {

        me = requireRole(["client"]);

        if (me == null) {
            return;
        }

        setText("userName", me.name);
        document.getElementById("face").textContent = me.name.charAt(0);
        document.getElementById("contact").value = me.phone;

        setText("postNote", autoApprove
            ? "The job goes live right away."
            : "An admin checks it first. After that every worker can see it.");

        fillList("skill", tradeList, "Choose");
        setupLocation("division", "district", "upazila");

        document.getElementById("jobForm").addEventListener("submit", postJob);

        loadMyJobs();
        loadApplicants();
        loadToRate();
    }

    async function postJob(event) {

        event.preventDefault();

        var result = await db.from("jobs").insert({
            title: val("title"),
            job_type: val("skill"),
            wage: val("wage"),
            workers_needed: val("workers"),
            duration: val("duration"),
            start_date: val("startDate"),
            division: val("division"),
            district: val("district"),
            upazila: val("upazila"),
            union_name: val("union"),
            address: val("exactLocation"),
            details: val("details"),
            contact_phone: val("contact"),
            status: newJobStatus(),
            client_id: me.id,
            client_name: me.name
        });

        if (result.error != null) {
            showMessage("Could not post the job. Try again.", "error");
            return;
        }

        showMessage(autoApprove
            ? "Posted. It is live on the Jobs page now."
            : "Posted. An admin will check it shortly.", "success");

        document.getElementById("jobForm").reset();
        document.getElementById("contact").value = me.phone;

        loadMyJobs();
    }

    async function loadMyJobs() {

        var result = await db.from("jobs")
            .select("id, title, wage, district, upazila, status, job_type")
            .eq("client_id", me.id)
            .order("created_at", { ascending: false });

        var rows = result.data;

        draw("jobLane", rows, myJobCard, '<p class="empty">You have not posted anything yet.</p>');

        var live = 0;
        var wait = 0;

        for (var i = 0; rows != null && i < rows.length; i++) {
            if (rows[i].status == "open") { live = live + 1; }
            if (rows[i].status == "pending") { wait = wait + 1; }
        }

        setText("countLive", live);
        setText("countWait", wait);
        setText("countAll", rows == null ? 0 : rows.length);
        setText("n1", rows == null ? 0 : rows.length);
    }

    function myJobCard(j) {

        var action = (j.status == "open")
            ? '<button type="button" class="btn-small warn" onclick="closeJob(\'' + j.id + '\')">Close</button>'
            : '';

        return '<div class="mini">'
            + '<div class="mini-top">'
            +     icon(j.job_type, 20, "#1B5CFF")
            +     '<span class="stamp ' + stampFor(j.status) + '">' + j.status + '</span>'
            + '</div>'
            + '<a href="job.html?id=' + j.id + '"><b>' + j.title + '</b></a>'
            + '<span class="mini-sub">' + area(j) + '</span>'
            + '<div class="mini-end"><span class="num">' + money(j.wage) + '</span>' + action + '</div>'
            + '</div>';
    }

    async function closeJob(id) {

        await db.from("jobs").update({ status: "closed" }).eq("id", id);

        showMessage("Job closed. You can rate the worker now.", "success");

        loadMyJobs();
        loadApplicants();
        loadToRate();
    }

    async function loadApplicants() {

        var result = await db.from("applications")
            .select("id, worker_name, worker_phone, status, jobs!inner(title, client_id)")
            .eq("jobs.client_id", me.id)
            .order("created_at", { ascending: false });

        var rows = result.data;
        var waiting = [];
        var hired = [];

        for (var i = 0; rows != null && i < rows.length; i++) {
            if (rows[i].status == "accepted") {
                hired.push(rows[i]);
            } else {
                waiting.push(rows[i]);
            }
        }

        draw("appLane", waiting, applicantCard, '<p class="empty">Nobody has applied yet.</p>');
        draw("hiredLane", hired, hiredCard, '<p class="empty">You have not hired anyone yet.</p>');

        setText("n2", waiting.length);
        setText("n3", hired.length);
    }

    function applicantCard(a) {

        var action = (a.status == "pending")
            ? '<button type="button" class="btn-small" onclick="answer(\'' + a.id + '\', \'accepted\')">Hire</button>'
              + '<button type="button" class="btn-small warn" onclick="answer(\'' + a.id + '\', \'rejected\')">No</button>'
            : '<span class="stamp ' + stampFor(a.status) + '">' + a.status + '</span>';

        return '<div class="mini">'
            + '<b>' + a.worker_name + '</b>'
            + '<span class="mini-sub">' + a.worker_phone + '</span>'
            + '<span class="mini-sub">' + (a.jobs ? a.jobs.title : "-") + '</span>'
            + '<div class="mini-end">' + action + '</div>'
            + '</div>';
    }

    function hiredCard(a) {

        return '<div class="mini">'
            + '<b>' + a.worker_name + '</b>'
            + '<span class="mini-sub">' + a.worker_phone + '</span>'
            + '<span class="mini-sub">' + (a.jobs ? a.jobs.title : "-") + '</span>'
            + '<div class="mini-end"><span class="stamp good">accepted</span></div>'
            + '</div>';
    }

    async function answer(id, status) {

        await db.from("applications").update({ status: status }).eq("id", id);

        showMessage(status == "accepted" ? "Worker hired." : "Worker turned down.", "success");

        loadApplicants();
    }

    async function loadToRate() {

        var hired = await db.from("applications")
            .select("job_id, worker_id, worker_name, jobs!inner(title, client_id, status)")
            .eq("status", "accepted")
            .eq("jobs.client_id", me.id)
            .eq("jobs.status", "closed");

        var done = await db.from("ratings").select("job_id, worker_id").eq("client_id", me.id);

        var alreadyRated = {};

        for (var i = 0; done.data != null && i < done.data.length; i++) {
            alreadyRated[done.data[i].job_id + "_" + done.data[i].worker_id] = true;
        }

        var waiting = [];

        for (var k = 0; hired.data != null && k < hired.data.length; k++) {
            var row = hired.data[k];

            if (alreadyRated[row.job_id + "_" + row.worker_id] != true) {
                waiting.push(row);
            }
        }

        draw("rateLane", waiting, rateCard,
            '<p class="empty">Nothing to rate right now. Close a finished job first.</p>');

        setText("n4", waiting.length);
    }

    function rateCard(a) {

        var key = a.job_id + "_" + a.worker_id;

        return '<div class="mini">'
            + '<b>' + a.worker_name + '</b>'
            + '<span class="mini-sub">' + (a.jobs ? a.jobs.title : "-") + '</span>'
            + '<div class="field" style="margin:10px 0 8px 0">'
            +     '<select id="stars' + key + '">'
            +         '<option value="5">5 stars</option><option value="4">4 stars</option>'
            +         '<option value="3">3 stars</option><option value="2">2 stars</option>'
            +         '<option value="1">1 star</option>'
            +     '</select>'
            + '</div>'
            + '<div class="field" style="margin:0 0 10px 0">'
            +     '<input type="text" id="note' + key + '" placeholder="Worked well, came on time">'
            + '</div>'
            + '<button type="button" class="btn-small" '
            +   'onclick="saveRating(' + a.job_id + ', ' + a.worker_id + ')">Save</button>'
            + '</div>';
    }

    async function saveRating(jobId, workerId) {

        var key = jobId + "_" + workerId;

        var result = await db.from("ratings").insert({
            job_id: jobId,
            worker_id: workerId,
            client_id: me.id,
            client_name: me.name,
            stars: Number(val("stars" + key)),
            comment: val("note" + key)
        });

        if (result.error != null) {
            showMessage("Could not save: " + result.error.message, "error");
            return;
        }

        showMessage("Rating saved.", "success");

        loadToRate();
    }
</script>

</body>
</html>
