<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Labour Market Place</title>
  </head>
  <body>
    <header class="bar"><nav class="container" id="nav"></nav></header>
    <main class="container">
      <article class="box">
        <h2>Login</h2>
        <p>Welcome back. Log in to your account.</p>
        <form id="login">
          <label
            >Phone Number<input
              name="phone"
              type="tel"
              placeholder="01XXXXXXXXX"
              required /></label
          ><label
            >Password<input
              name="password"
              type="password"
              placeholder="Your password"
              required /></label
          ><button>Login</button><small id="msg"></small>
        </form>
        <p>No account? <a href="register.html">Register</a></p>
      </article>
    </main>
    <footer class="container">
      <small>&copy; 2026 Labour Market Place. All rights reserved.</small>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
