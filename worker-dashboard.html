<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Worker | Labour Market Place</title>
</head>

<body>

    <header class="topbar" id="nav"></header>

    <main>

        <section class="profile-bar">
            <div class="profile-inner">

                <div class="face" id="face"></div>

                <div class="who">
                    <b id="userName"></b>
                    <span id="myTrade">Worker</span>
                </div>

                <div class="who-stats">
                    <div>
                        <b class="hot" id="myRate">-</b>
                        <span>My daily rate</span>
                    </div>
                    <div>
                        <b id="myStars">-</b>
                        <span>My rating</span>
                    </div>
                    <div>
                        <b id="countHired">0</b>
                        <span>Times hired</span>
                    </div>
                    <div>
                        <b id="countSent">0</b>
                        <span>Applications sent</span>
                    </div>
                </div>

            </div>
        </section>

        <div class="wrap">

            <div id="message" class="msg"></div>

            <h2 class="title">Work for you</h2>
            <p class="note" id="matchNote" style="margin-bottom:16px">Jobs that need your trade.</p>

            <div class="cards" id="matchList">
                <p class="loading">Loading...</p>
            </div>

            <h2 class="title" style="margin-top:38px">My applications</h2>

            <div class="panel" id="appList" style="padding:6px 22px">
                <p class="loading">Loading...</p>
            </div>

            <h2 class="title" style="margin-top:38px">What employers said</h2>

            <div id="reviewList">
                <p class="loading">Loading...</p>
            </div>

            <h2 class="title" style="margin-top:38px">My trade</h2>

            <div class="panel" id="profile">
                <p class="note">Employers find you by your trade and your daily rate.</p>

                <form id="profileForm" style="margin-top: 18px;">

                    <div class="two">
                        <div class="field">
                            <label for="skill">My trade</label>
                            <select id="skill" required></select>
                        </div>

                        <div class="field">
                            <label for="rate">My daily rate (Tk)</label>
                            <input type="number" id="rate" placeholder="900" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="about">About my work</label>
                        <textarea id="about" rows="3" placeholder="Years of experience, what you have built"></textarea>
                    </div>

                    <button type="submit" class="btn btn-main">Save</button>

                </form>
            </div>

        </div>
    </main>

    <footer id="foot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lang.js"></script>
    <script src="icons.js"></script>
    <script src="db.js"></script>
    <script src="voice.js"></script>

    <script>    var me = null;

    layout("");

    addFieldMics();

    start();

    async function start() {

        me = requireRole(["worker"]);

        if (me == null) {
            return;
        }

        setText("userName", me.name);

        document.getElementById("face").textContent = me.name.charAt(0);

        fillList("skill", tradeList, "Choose");

        document.getElementById("profileForm").addEventListener("submit", saveProfile);

        loadProfile();
        loadMatching();
        loadApplications();
        loadReviews();
    }

    async function loadProfile() {

        var result = await db.from("users")
            .select("skill, daily_rate, about")
            .eq("id", me.id)
            .maybeSingle();

        var u = result.data;

        if (u == null) {
            return;
        }

        document.getElementById("skill").value = u.skill || "";
        document.getElementById("rate").value = u.daily_rate || "";
        document.getElementById("about").value = u.about || "";

        setText("myRate", u.daily_rate == null ? "-" : money(u.daily_rate));

        if (u.skill != null && u.skill != "") {
            document.getElementById("myTrade").innerHTML =
                '<span class="trade">' + icon(u.skill, 16, "#1B5CFF") + u.skill + '</span>';
            applyLanguage();
        }
    }

    async function saveProfile(event) {

        event.preventDefault();

        await db.from("users").update({
            skill: val("skill"),
            daily_rate: val("rate"),
            about: val("about")
        }).eq("id", me.id);

        me.skill = val("skill");
        saveUser(me);

        showMessage("Saved. Employers can see this now.", "success");

        loadProfile();
        loadMatching();
    }

    async function loadMatching() {

        if (me.skill == null || me.skill == "") {
            document.getElementById("matchList").innerHTML =
                '<p class="empty">Pick your trade below first.</p>';
            return;
        }

        var result = await db.from("jobs")
            .select("id, title, wage, district, upazila, job_type, start_date, workers_needed")
            .eq("status", "open")
            .eq("job_type", me.skill)
            .order("created_at", { ascending: false });

        draw("matchList", result.data, matchCard,
            '<p class="empty">No open job for your trade right now.</p>');
    }

    function matchCard(j) {

        return '<div class="card">'
            + '<div class="card-body">'
            +     '<p class="trade">' + icon(j.job_type, 16, "#1B5CFF") + j.job_type + '</p>'
            +     '<h3><a href="job.html?id=' + j.id + '">' + j.title + '</a></h3>'
            +     '<ul class="facts">'
            +         '<li>' + area(j) + '</li>'
            +         '<li>' + (j.start_date || "-") + '</li>'
            +         '<li>' + (j.workers_needed || 1) + ' ' + t("hands") + '</li>'
            +     '</ul>'
            + '</div>'
            + '<div class="card-end">'
            +     '<div class="wage">' + money(j.wage) + '<small>per day</small></div>'
            +     '<button type="button" class="btn btn-main" onclick="apply(\'' + j.id + '\')">Apply</button>'
            + '</div>'
            + '</div>';
    }

    async function apply(jobId) {

        var ok = await applyToJob(jobId);

        if (ok) {
            loadApplications();
        }
    }

    async function loadApplications() {

        var result = await db.from("applications")
            .select("status, created_at, jobs(title, wage)")
            .eq("worker_id", me.id)
            .order("created_at", { ascending: false });

        var rows = result.data;

        draw("appList", rows, appRow,
            '<p class="empty">You have not applied anywhere yet.</p>');

        var hired = 0;

        for (var i = 0; rows != null && i < rows.length; i++) {
            if (rows[i].status == "accepted") { hired = hired + 1; }
        }

        setText("countSent", rows == null ? 0 : rows.length);
        setText("countHired", hired);
    }

    function appRow(a) {

        var shade = stampFor(a.status);

        return '<div class="app-row">'
            + '<span class="dot ' + shade + '"></span>'
            + '<div class="app-main">'
            +     '<b>' + (a.jobs ? a.jobs.title : "-") + '</b>'
            +     '<span>Sent ' + a.created_at.substring(0, 10) + '</span>'
            + '</div>'
            + '<span class="num" style="font-size:20px;font-weight:700">' + money(a.jobs ? a.jobs.wage : "-") + '</span>'
            + '<span class="stamp ' + shade + '">' + a.status + '</span>'
            + '</div>';
    }

    async function loadReviews() {

        var result = await db.from("ratings")
            .select("client_name, stars, comment, created_at")
            .eq("worker_id", me.id)
            .order("created_at", { ascending: false });

        var rows = result.data;

        draw("reviewList", rows, reviewCard,
            '<p class="empty">No employer has rated you yet.</p>');

        if (rows == null || rows.length == 0) {
            return;
        }

        var sum = 0;

        for (var i = 0; i < rows.length; i++) {
            sum = sum + rows[i].stars;
        }

        setText("myStars", (sum / rows.length).toFixed(1));
    }

    function reviewCard(r) {

        return '<div class="quote">'
            + '<p>' + (r.comment || "-") + '</p>'
            + '<span class="by">' + starBar(r.stars) + ' &middot; ' + r.client_name
            +   ' &middot; ' + r.created_at.substring(0, 10) + '</span>'
            + '</div>';
    }
</script>

</body>
</html>
