<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Labour Market Place</title>
  </head>
  <body data-auth>
    <header class="bar"><nav class="container" id="nav"></nav></header>
    <main class="container">
      <h2>Jobs</h2>
      <article id="post" hidden>
        <h4>Post a job</h4>
        <form id="jobform">
          <input name="title" placeholder="Job title" required /><textarea
            name="description"
            placeholder="Work details"
          ></textarea>
          <div class="grid">
            <select name="district" required>
              <option value="">District</option></select
            ><input
              name="wage"
              type="number"
              min="0"
              placeholder="Budget per day (৳)"
            /><input
              name="hours"
              type="number"
              min="1"
              max="24"
              placeholder="Hours per day"
            />
          </div>
          <button>Post Job</button><small id="msg"></small>
        </form>
      </article>
      <div id="list" class="grid-list" aria-busy="true"></div>
    </main>
    <footer class="container">
      <small>&copy; 2026 Labour Market Place. All rights reserved.</small>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
