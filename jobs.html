<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Jobs | Labour Market Place</title>
</head>

<body>

    <header class="topbar" id="nav"></header>

    <main>
        <section class="page-top">
            <h1>Open work</h1>
            <p>Every job here was checked by an admin before it went up.</p>
        </section>

        <div class="wrap">

            <div class="panel">
                <div class="two">
                    <div class="field">
                        <label for="district">District</label>
                        <select id="district"></select>
                    </div>

                    <div class="field">
                        <label for="skill">Trade</label>
                        <select id="skill"></select>
                    </div>
                </div>

                <button type="button" class="btn btn-main" onclick="loadJobs()">Search</button>
            </div>

            <div id="message" class="msg"></div>

            <p class="dim" id="count"></p>

            <div class="cards" id="list">
                <p class="loading">Loading...</p>
            </div>

        </div>
    </main>

    <footer id="foot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>

    <script>
    layout("jobs.html");

    fillList("district", districtList, "All districts");
    fillList("skill", tradeList, "All trades");

    loadJobs();


    async function loadJobs() {

        document.getElementById("list").innerHTML = '<p class="loading">Loading...</p>';

        var query = db.from("jobs").select("*").eq("status", "open");

        if (val("district") != "") {
            query = query.eq("district", val("district"));
        }

        if (val("skill") != "") {
            query = query.eq("job_type", val("skill"));
        }

        var result = await query.order("created_at", { ascending: false });
        var rows = result.data;

        setText("count", (rows == null || rows.length == 0)
            ? "Nothing found. Try a wider search."
            : rows.length + " jobs open");

        draw("list", rows, jobCard, "");
    }


    function jobCard(j) {

        return '<div class="card">'
            + '<div class="card-head">'
            + '<h3><a href="job.html?id=' + j.id + '">' + j.title + '</a></h3>'
            + '<div class="wage">Tk ' + j.wage + '<small>per day</small></div>'
            + '</div>'
            + '<p class="trade">' + j.job_type + '</p>'
            + '<ul class="facts">'
            + '<li><span>Area</span> ' + area(j) + '</li>'
            + '<li><span>Starts</span> ' + (j.start_date || "-") + '</li>'
            + '<li><span>Hands needed</span> ' + (j.workers_needed || 1) + '</li>'
            + '<li><span>Posted by</span> ' + (j.client_name || "-") + '</li>'
            + '</ul>'
            + '<a href="job.html?id=' + j.id + '" class="btn btn-soft btn-wide">See the details</a>'
            + '</div>';
    }

    </script>

</body>
</html>
