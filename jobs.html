<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Jobs | Labour Market Place</title>
</head>

<body>

    <header class="topbar" id="nav"></header>

    <main>
        <section class="page-top">
            <h1>Open work</h1>
            <p>Press a tool to see only that kind of work.</p>
        </section>

        <div class="wrap">

            <div class="filter-strip" id="strip"></div>

            <div class="panel" style="padding:18px 20px">
                <div class="two">
                    <div class="field" style="margin-bottom:0">
                        <label for="district">District</label>
                        <select id="district" onchange="loadJobs()"></select>
                    </div>

                    <div class="field" style="margin-bottom:0; align-self:end">
                        <button type="button" class="btn btn-soft btn-wide" onclick="clearAll()">Show everything</button>
                    </div>
                </div>
            </div>

            <div id="message" class="msg"></div>

            <p class="dim" id="count"></p>

            <div class="cards" id="list">
                <p class="loading">Loading...</p>
            </div>

        </div>
    </main>

    <footer id="foot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lang.js"></script>
    <script src="icons.js"></script>
    <script src="db.js"></script>

    <script>    layout("jobs.html");

    fillList("district", districtList, "All districts");

    var pickedTrade = new URLSearchParams(window.location.search).get("trade");

    if (pickedTrade == null) {
        pickedTrade = "";
    }

    drawStrip();
    loadJobs();

    function drawStrip() {

        var html = "";

        for (var i = 0; i < tradeList.length; i++) {
            var trade = tradeList[i];
            var on = (trade == pickedTrade);
            var lineColour = on ? "#ffffff" : "#1B5CFF";

            html = html
                + '<button type="button" class="pick' + (on ? " on" : "") + '"'
                +   ' onclick="pickTrade(\'' + trade + '\')">'
                +   icon(trade, 30, lineColour)
                +   '<span>' + trade + '</span>'
                + '</button>';
        }

        document.getElementById("strip").innerHTML = html;
        applyLanguage();
    }

    function pickTrade(trade) {

        pickedTrade = (pickedTrade == trade) ? "" : trade;

        drawStrip();
        loadJobs();
    }

    function clearAll() {
        pickedTrade = "";
        document.getElementById("district").value = "";
        drawStrip();
        loadJobs();
    }

    async function loadJobs() {

        document.getElementById("list").innerHTML = '<p class="loading">Loading...</p>';

        var query = db.from("jobs").select("*").in("status", ["open", "closed"]);

        if (val("district") != "") {
            query = query.eq("district", val("district"));
        }

        if (pickedTrade != "") {
            query = query.eq("job_type", pickedTrade);
        }

        var result = await query.order("created_at", { ascending: false });
        var rows = result.data;

        setText("count", (rows == null || rows.length == 0)
            ? "Nothing found. Try a wider search."
            : rows.length + " " + t("jobs found"));

        draw("list", rows, jobCard, "");
    }

    function jobCard(j) {

        var filled = (j.status != "open");

        return '<div class="card' + (filled ? " off" : "") + '">'
            + '<div class="card-body">'
            +     '<p class="trade">' + icon(j.job_type, 16, "#1B5CFF") + j.job_type + '</p>'
            +     '<h3><a href="job.html?id=' + j.id + '">' + j.title + '</a></h3>'
            +     '<ul class="facts">'
            +         '<li>' + area(j) + '</li>'
            +         '<li>' + (j.start_date || "-") + '</li>'
            +         '<li>' + (j.workers_needed || 1) + ' ' + t("hands") + '</li>'
            +         '<li>' + (j.client_name || "-") + '</li>'
            +     '</ul>'
            + '</div>'
            + '<div class="card-end">'
            +     '<div class="wage">' + money(j.wage) + '<small>per day</small></div>'
            +     (filled
                    ? '<span class="stamp off">Filled</span>'
                    : '<a href="job.html?id=' + j.id + '" class="btn btn-main">Open</a>')
            + '</div>'
            + '</div>';
    }
</script>

</body>
</html>
