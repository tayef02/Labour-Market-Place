<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Labour Market Place</title>
  </head>
  <body data-auth>
    <header class="bar"><nav class="container" id="nav"></nav></header>
    <main class="container">
      <h2>Wage Rates</h2>
      <p>Average daily wage by skill, from registered workers.</p>
      <table>
        <thead>
          <tr>
            <th>Skill</th>
            <th>Workers</th>
            <th>Average</th>
            <th>Range</th>
          </tr>
        </thead>
        <tbody id="wages"></tbody>
      </table>
    </main>
    <footer class="container">

    </footer>
    <script src="app.js"></script>
  </body>
</html>
