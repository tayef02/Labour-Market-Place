<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Job | Labour Market Place</title>
</head>

<body>

    <header class="topbar" id="nav"></header>

    <main>
        <div class="wrap" style="max-width: 660px;">

            <div id="message" class="msg"></div>

            <div id="sheet">
                <p class="loading">Loading...</p>
            </div>

            <p class="under"><a href="jobs.html">Back to all jobs</a></p>

        </div>
    </main>

    <footer id="foot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lang.js"></script>
    <script src="icons.js"></script>
    <script src="db.js"></script>

    <script>    var jobId = idFromUrl();

    layout("jobs.html");

    loadJob();

    async function loadJob() {

        var result = await db.from("jobs").select("*").eq("id", jobId).maybeSingle();
        var j = result.data;

        if (j == null) {
            document.getElementById("sheet").innerHTML =
                '<p class="empty">This job was not found.</p>';
            return;
        }

        document.title = j.title + " | Labour Market Place";

        document.getElementById("sheet").innerHTML =
              '<div class="slip">'

            + '<div class="slip-top">'
            +     '<span>Work order</span>'
            +     '<span class="num">No. ' + String(j.id).substring(0, 8) + '</span>'
            + '</div>'

            + '<div class="slip-head">'
            +     '<span class="slip-icon">' + icon(j.job_type, 46, "#1B5CFF") + '</span>'
            +     '<div>'
            +         '<h1>' + j.title + '</h1>'
            +         '<p>' + j.job_type + ' ' + t("needed") + ' &middot; '
            +            '<span class="stamp ' + stampFor(j.status) + '">' + j.status + '</span></p>'
            +     '</div>'
            + '</div>'

            + '<div class="tear"></div>'

            + '<div class="slip-wage">'
            +     '<div>'
            +         '<b class="num">' + money(j.wage) + '</b>'
            +         '<span>per day, per person</span>'
            +     '</div>'
            +     '<div>'
            +         '<b class="num">' + (j.workers_needed || 1) + '</b>'
            +         '<span>hands needed</span>'
            +     '</div>'
            +     '<div>'
            +         '<b class="num">' + (j.duration || "-") + '</b>'
            +         '<span>how long</span>'
            +     '</div>'
            + '</div>'

            + '<div class="tear"></div>'

            + '<div class="docket">'
            +     line("Starts", j.start_date || "-")
            +     line("Division", j.division || "-")
            +     line("Area", area(j))
            +     line("Union or ward", j.union_name || "-")
            +     line("Exact spot", j.address || "-")
            +     line("Posted by", j.client_name || "-")
            +     line("Phone", j.contact_phone || "-")
            + '</div>'

            + (j.details ? '<p class="slip-note">' + j.details + '</p>' : '')

            + '<div class="slip-foot">'
            +     (j.status == "open"
                    ? '<button type="button" class="btn btn-main btn-wide"'
                      + ' onclick="applyToJob(\'' + j.id + '\')">Apply for this job</button>'
                    : '<p class="note">This job is not open, so you cannot apply.</p>')
            + '</div>'

            + '</div>';

        applyLanguage();
    }

    function line(label, value) {
        return '<div><span>' + label + '</span><b>' + value + '</b></div>';
    }
</script>

</body>
</html>
