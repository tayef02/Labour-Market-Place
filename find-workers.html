<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Find Workers | Labour Market Place</title>
</head>

<body>

    <header class="topbar" id="nav"></header>

    <main>
        <section class="page-top">
            <h1>Find workers</h1>
            <p>Press a tool to see only that kind of worker.</p>
        </section>

        <div class="wrap">

            <div class="filter-strip" id="strip"></div>

            <div class="panel" style="padding:18px 20px">
                <div class="two">
                    <div class="field" style="margin-bottom:0">
                        <label for="district">District</label>
                        <select id="district" onchange="loadWorkers()"></select>
                    </div>

                    <div class="field" style="margin-bottom:0; align-self:end">
                        <button type="button" class="btn btn-soft btn-wide" onclick="clearAll()">Show everything</button>
                    </div>
                </div>
            </div>

            <div id="message" class="msg"></div>

            <p class="dim" id="count"></p>

            <div class="cards" id="list">
                <p class="loading">Loading...</p>
            </div>

        </div>
    </main>

    <footer id="foot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lang.js"></script>
    <script src="icons.js"></script>
    <script src="db.js"></script>

    <script>    var me = currentUser();
    var scores = {};

    layout("find-workers.html");

    fillList("district", districtList, "All districts");

    var pickedTrade = "";

    drawStrip();
    loadWorkers();

    function drawStrip() {

        var html = "";

        for (var i = 0; i < tradeList.length; i++) {
            var trade = tradeList[i];
            var on = (trade == pickedTrade);

            html = html
                + '<button type="button" class="pick' + (on ? " on" : "") + '"'
                +   ' onclick="pickTrade(\'' + trade + '\')">'
                +   icon(trade, 30, on ? "#ffffff" : "#1B5CFF")
                +   '<span>' + trade + '</span>'
                + '</button>';
        }

        document.getElementById("strip").innerHTML = html;
        applyLanguage();
    }

    function pickTrade(trade) {
        pickedTrade = (pickedTrade == trade) ? "" : trade;
        drawStrip();
        loadWorkers();
    }

    function clearAll() {
        pickedTrade = "";
        document.getElementById("district").value = "";
        drawStrip();
        loadWorkers();
    }

    async function loadWorkers() {

        document.getElementById("list").innerHTML = '<p class="loading">Loading...</p>';

        var query = db.from("users")
            .select("id, name, phone, skill, daily_rate, about, district, upazila")
            .eq("role", "worker")
            .eq("is_active", true);

        if (val("district") != "") {
            query = query.eq("district", val("district"));
        }

        if (pickedTrade != "") {
            query = query.eq("skill", pickedTrade);
        }

        var result = await query.order("created_at", { ascending: false });
        var rows = result.data;

        if (rows == null || rows.length == 0) {
            document.getElementById("list").innerHTML = "";
            setText("count", "No worker found. Try a wider search.");
            return;
        }

        var ids = [];

        for (var i = 0; i < rows.length; i++) {
            ids.push(rows[i].id);
        }

        scores = await averageStars(ids);

        setText("count", rows.length + " " + t("workers found"));

        draw("list", rows, workerCard, "");
    }

    function workerCard(w) {

        var phone = (me == null)
            ? '<a href="login.html">log in to see</a>'
            : w.phone;

        return '<div class="card">'
            + '<span class="face small">' + w.name.charAt(0) + '</span>'
            + '<div class="card-body">'
            +     '<p class="trade">' + icon(w.skill, 16, "#1B5CFF")
            +         (w.skill || "trade not set") + '</p>'
            +     '<h3>' + w.name + '</h3>'
            +     '<ul class="facts">'
            +         '<li>' + area(w) + '</li>'
            +         '<li>' + starBar(scores[w.id]) + '</li>'
            +         '<li>' + phone + '</li>'
            +     '</ul>'
            +     (w.about ? '<p class="dim" style="margin:10px 0 0 0">' + w.about + '</p>' : '')
            + '</div>'
            + '<div class="card-end">'
            +     '<div class="wage">' + money(w.daily_rate || "-") + '<small>per day</small></div>'
            + '</div>'
            + '</div>';
    }
</script>

</body>
</html>
